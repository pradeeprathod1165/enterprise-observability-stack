global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'chat-webhook'

receivers:
  - name: 'chat-webhook'
    discord_configs:
      - webhook_url: '<YOUR_DISCORD_WEBHOOK_URL>'
        send_resolved: true
        message: |-
          {{ range .Alerts }}
          **ALERT:** {{ .Annotations.summary }}
          {{ end }}
